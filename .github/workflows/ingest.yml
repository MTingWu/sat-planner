name: Scheduled Data Ingestion

# 設定觸發時機
on:
  schedule:
    # 每天 UTC 時間 00:00 (台灣時間早上 8 點) 自動執行
    - cron: '0 0 * * *'
  # 允許我們在 GitHub 網頁上手動點擊執行
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
    - name: 取得程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 3.12 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 安裝相依套件
      run: |
        python -m pip install --upgrade pip
        pip install -r api/requirements.txt

    - name: 執行資料爬取與入庫
      env:
        # 這裡會讀取我們之後在 GitHub 設定的雲端資料庫密碼 (Secret)
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        cd api
        python -m app.jobs.ingest_plans
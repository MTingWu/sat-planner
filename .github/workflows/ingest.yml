name: ingest-plans

on:
  schedule:
    - cron: "23 18 * * *"   # 每天 UTC 18:23，即台灣時間 02:23；避開整點，GitHub 整點排程常延遲或被跳過
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r api/requirements.txt

      - run: python -m app.jobs.ingest_plans
        working-directory: api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
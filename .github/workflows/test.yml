name: Backend Tests

# 設定觸發時機：當推送到 main 分支，或發起 Pull Request 時執行
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read            # 測試只需要讀程式碼

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # CI 用的臨時 PostGIS；建表後整合測試會真的打到資料庫
    services:
      db:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sat_planner
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/sat_planner

    steps:
    - name: 取得程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 3.12 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 安裝相依套件與 pytest
      run: |
        python -m pip install --upgrade pip
        pip install -r api/requirements.txt
        pip install pytest httpx

    - name: 建立資料表（依序執行 db/init/*.sql）
      run: |
        for f in db/init/*.sql; do
          echo "== $f"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
        done

    - name: 執行測試（含 PostGIS 整合測試）
      run: |
        cd api
        pytest -rs           # -rs：列出被略過的測試與原因，整合測試若被略過一眼就看得到
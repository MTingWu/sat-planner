name: Backend Tests

# 設定觸發時機：當推送到 main 分支，或發起 Pull Request 時執行
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    # 設定 CI 環境的服務：我們需要一個帶有 PostGIS 的資料庫讓 API 匯入時不報錯
    services:
      db:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sat_planner
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: 取得程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 3.12 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 安裝相依套件與 pytest
      run: |
        python -m pip install --upgrade pip
        pip install -r api/requirements.txt
        pip install pytest httpx

    - name: 執行單元測試
      env:
        # 讓 API 連線到 CI 環境裡的臨時資料庫
        DATABASE_URL: postgresql://postgres:password@localhost:5432/sat_planner
      run: |
        cd api
        pytest
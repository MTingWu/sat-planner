services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: sat
      POSTGRES_PASSWORD: sat
      POSTGRES_DB: satplan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
  api:
      build: ./api
      environment:
        DATABASE_URL: postgresql://sat:sat@db:5432/satplan
      ports:
        - "8000:8000"
      depends_on:
        - db
        
volumes:
  pgdata:
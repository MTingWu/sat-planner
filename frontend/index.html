<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>衛星觀測日曆</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <style>
        :root {
            --sar: #e8590c;          /* 雷達：與地圖 footprint 同色 */
            --msi: #1971c2;          /* 光學 */
            --ink: #1f2933;
            --muted: #6b7684;
            --line: #dde1e6;
            --panel: #fafbfc;
            --pending: #b8bfc7;      /* 計畫尚未公布 */
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; display: flex; height: 100vh; flex-wrap: wrap;
            font-family: system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            color: var(--ink);
        }
        #map { flex: 1; min-width: 300px; height: 100%; }

        #resizer {
            width: 6px; flex-shrink: 0; cursor: col-resize; touch-action: none;
            background: var(--line); transition: background .15s;
        }
        #resizer:hover, #resizer.dragging { background: var(--msi); }

        #panel {
            width: 450px; height: 100%; flex-shrink: 0; overflow: auto;
            padding: 16px 18px 24px; background: var(--panel);
        }
        h1 { font-size: 20px; margin: 0 0 6px; }
        h2 { font-size: 16px; margin: 0 0 10px; }

        /* 查詢範圍 */
        #scope { font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        #scope strong { font-weight: 600; }
        .hint { font-size: 13px; color: var(--muted); margin: 4px 0 14px; }
        button.link {
            font: inherit; font-size: 13px; color: var(--msi); background: none;
            border: 1px solid var(--msi); border-radius: 4px; padding: 2px 8px; cursor: pointer;
        }
        .warning {
            font-size: 13px; color: #b42318; background: #fef3f2; border: 1px solid #fecdca;
            border-radius: 4px; padding: 8px 10px; margin-bottom: 10px;
        }

        /* 圖例 */
        .legend { font-size: 12px; color: var(--muted); margin-bottom: 10px; line-height: 1.9; }
        .legend .row { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
        .legend .item { display: inline-flex; align-items: center; gap: 4px; }

        /* 標記：形狀＝感測器，填色＝狀態，位置＝衛星（每格順序固定） */
        .mk {
            display: inline-block; width: 9px; height: 9px; flex-shrink: 0;
            border: 1.5px solid var(--c);
        }
        .mk.sar { --c: var(--sar); border-radius: 1px; }
        .mk.msi { --c: var(--msi); border-radius: 50%; }
        .mk.hit { background: var(--c); }
        .mk.partial { background: linear-gradient(to top, var(--c) 50%, transparent 50%); }
        .mk.near { background: transparent; }
        .mk.none { visibility: hidden; }
        .mk.unpublished { --c: var(--pending); border-style: dashed; }

        /* 日曆 */
        .weekdays, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
        .weekdays { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 3px; }
        .cal-grid.loading { opacity: .45; pointer-events: none; }
        .cell {
            min-height: 54px; padding: 4px 4px 5px; background: #fff;
            border: 1px solid var(--line); border-radius: 3px; cursor: pointer;
            display: flex; flex-direction: column; gap: 5px;
        }
        .cell:hover { border-color: var(--muted); }
        .cell:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
        .cell.selected { border: 2px solid var(--ink); padding: 3px 3px 4px; }
        .cell.pad { background: transparent; border: none; cursor: default; }
        .cell .date { font-size: 12px; line-height: 1; }
        .cell.today { background: #eef4fb; }
        .cell.today .date { font-weight: 700; }
        .cell .marks { display: flex; flex-wrap: wrap; gap: 3px; }
        .cell .marks .mk { cursor: pointer; }

        /* 當日明細 */
        #day-detail { margin-top: 18px; }
        #day-detail .empty { font-size: 13px; color: var(--muted); }
        .advice {
            font-size: 14px; background: #fff; border: 1px solid var(--line); border-left: 3px solid var(--ink);
            padding: 8px 10px; margin-bottom: 12px; border-radius: 3px;
        }
        .advice .reason { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
        .sat-list { list-style: none; margin: 0; padding: 0; }
        .sat-row { padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
        .sat-row .head { display: flex; align-items: center; gap: 8px; }
        .sat-row .state { color: var(--muted); font-size: 13px; }
        .acq {
            display: block; width: 100%; text-align: left; font: inherit; font-size: 13px;
            margin-top: 6px; padding: 6px 8px 6px 25px; background: #fff; color: var(--ink);
            border: 1px solid var(--line); border-radius: 3px; cursor: pointer;
        }
        .acq:hover { border-color: var(--muted); }
        .acq.active { border-color: var(--ink); box-shadow: inset 3px 0 0 var(--ink); }
        .acq .meta { display: flex; flex-wrap: wrap; gap: 2px 12px; }
        .acq .where { color: var(--muted); }
        .sat-tooltip { font-size: 13px; }

        @media (max-width: 768px) {
            #map { height: 50%; }
            #resizer { display: none; }
            #panel { width: 100%; height: 50%; border-top: 2px solid var(--line); }
        }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="resizer" title="拖曳調整面板寬度"></div>
    <div id="panel">
        <h1>衛星觀測日曆</h1>
        <div id="scope"></div>
        <p class="hint">在地圖上框選範圍，日曆會改以該範圍重新計算。淺藍底的格子是今天。</p>
        <div id="warnings"></div>

        <div class="legend" id="legend"></div>
        <div class="weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
        <div id="calendar" class="cal-grid"></div>

        <section id="day-detail">
            <p class="empty">點選日期，查看當天每顆衛星的狀態。</p>
        </section>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script>
    const API_BASE = location.hostname === "localhost"
        ? "http://localhost:8000"
        : "https://sat-planner.onrender.com";
    const DAYS = 14;

    const STATUS_TEXT = {
        hit: "拍到", partial: "部分拍到", near: "經過附近，未涵蓋",
        none: "無過境", unpublished: "計畫尚未公布",
    };
    const DIRECTION_TEXT = { ascending: "升軌", descending: "降軌" };
    const SENSOR_TEXT = { SAR: "雷達", MSI: "光學" };
    const WEEKDAY = ["日", "一", "二", "三", "四", "五", "六"];

    // ---------- 狀態 ----------
    const state = {
        aoi: null,            // 自訂 AOI 的 GeoJSON geometry；null 表示預設台灣
        cal: null,            // /api/calendar 回應
        recByDate: {},        // 推薦結論（只有自訂 AOI 時才有）
        cloudById: {},        // MSI 雲量，依取像 id
        selectedDate: null,
        selectedAcq: null,
    };
    const footprintCache = new Map();

    // ---------- 地圖 ----------
    const map = L.map('map').setView([23.7, 120.9], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors | 天氣資料：Open-Meteo | 行政區界：內政部國土測繪中心'
    }).addTo(map);

    const drawnItems = new L.FeatureGroup().addTo(map);
    map.addControl(new L.Control.Draw({
        draw: { polyline: false, circle: false, marker: false, circlemarker: false, polygon: true, rectangle: true },
        edit: { featureGroup: drawnItems, remove: true }
    }));
    const presetLayer = L.geoJSON(null, {
        style: { color: '#6b7684', weight: 1, dashArray: '4 3', fill: false }, interactive: false
    }).addTo(map);
    const footprintLayer = L.featureGroup().addTo(map);

    // ---------- 面板寬度拖曳 ----------
    (() => {
        const resizer = document.getElementById('resizer');
        const panel = document.getElementById('panel');
        let raf = null;
        resizer.addEventListener('pointerdown', e => {
            resizer.setPointerCapture(e.pointerId);
            resizer.classList.add('dragging');
            document.body.style.userSelect = 'none';
        });
        resizer.addEventListener('pointermove', e => {
            if (!resizer.hasPointerCapture(e.pointerId)) return;
            const w = Math.min(Math.max(window.innerWidth - e.clientX, 350), window.innerWidth * 0.6);
            panel.style.width = `${w}px`;
            if (!raf) raf = requestAnimationFrame(() => { map.invalidateSize(); raf = null; });
        });
        const stop = e => {
            if (!resizer.hasPointerCapture(e.pointerId)) return;
            resizer.releasePointerCapture(e.pointerId);
            resizer.classList.remove('dragging');
            document.body.style.userSelect = '';
            map.invalidateSize();
        };
        resizer.addEventListener('pointerup', stop);
        resizer.addEventListener('pointercancel', stop);
        window.addEventListener('resize', () => map.invalidateSize());
    })();

    // ---------- 工具函式 ----------
    async function api(path, body) {
        const res = await fetch(`${API_BASE}${path}`, body === undefined ? {} : {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
            const d = data.detail;
            throw new Error(typeof d === 'string' ? d : `伺服器回應 ${res.status}`);
        }
        return data;
    }
    const sensorClass = s => s === 'SAR' ? 'sar' : 'msi';
    const shortName = p => p.replace(/^S/, '');                    // S1C → 1C
    const hhmm = iso => iso.substring(11, 16);                       // 後端已輸出台北時間
    const pct = c => c <= 0 ? '0%' : c < 0.01 ? '<1%' : `${Math.round(c * 100)}%`;
    const counties = (list, max = 3) => !list || !list.length ? '' :
        list.length <= max ? list.join('、') : `${list.slice(0, max).join('、')} 等 ${list.length} 個縣市`;
    function weekdayOf(dateStr) {                                    // 0 = 週日
        const [y, m, d] = dateStr.split('-').map(Number);
        return new Date(Date.UTC(y, m - 1, d)).getUTCDay();
    }
    function showWarnings(list) {
        document.getElementById('warnings').innerHTML =
            list.map(w => `<div class="warning">${w}</div>`).join('');
    }
    function scopeName() {
        return state.aoi
            ? `自訂框選範圍${state.cal?.aoi?.km2 != null ? `（${state.cal.aoi.km2} km²）` : ''}`
            : '台灣（本島＋近岸離島）';
    }

    // ---------- 載入資料 ----------
    async function load() {
        const grid = document.getElementById('calendar');
        grid.classList.add('loading');
        showWarnings([]);
        footprintLayer.clearLayers();
        state.selectedAcq = null;

        const body = state.aoi ? { geometry: state.aoi, days: DAYS } : { days: DAYS };
        const calReq = api('/api/calendar', body);
        const oppReq = state.aoi ? api('/api/opportunities', { geometry: state.aoi, days: DAYS }) : null;

        try {
            state.cal = await calReq;
        } catch (err) {
            // 清空舊結果，避免畫面顯示的是上一個範圍的日曆
            state.cal = null;
            state.selectedDate = null;
            grid.classList.remove('loading');
            grid.innerHTML = '';
            document.getElementById('legend').innerHTML = '';
            document.getElementById('day-detail').innerHTML = '';
            renderScope();
            showWarnings([`無法載入日曆：${err.message}`]);
            oppReq?.catch(() => {});
            return;
        }

        state.recByDate = {};
        state.cloudById = {};
        const warnings = [];
        if (oppReq) {
            try {
                const opp = await oppReq;
                opp.recommendations.forEach(r => state.recByDate[r.date] = r);
                opp.acquisitions.forEach(a => { if (a.cloud != null) state.cloudById[a.id] = a.cloud; });
                warnings.push(...opp.warnings);
            } catch (err) {
                warnings.push(`無法取得觀測建議：${err.message}`);
            }
        }
        showWarnings(warnings);

        grid.classList.remove('loading');
        if (!state.cal.dates.includes(state.selectedDate)) state.selectedDate = null;
        renderScope();
        renderLegend();
        renderCalendar();
        renderDetail();
    }

    // ---------- 繪製 ----------
    function renderScope() {
        const el = document.getElementById('scope');
        el.innerHTML = `<span>查詢範圍：<strong>${scopeName()}</strong></span>` +
            (state.aoi ? `<button class="link" id="reset-aoi">改回台灣</button>` : '');
        document.getElementById('reset-aoi')?.addEventListener('click', resetAoi);
    }

    function renderLegend() {
        const plats = state.cal.platforms.map(p =>
            `<span class="item"><span class="mk ${sensorClass(p.sensor)} hit"></span>${shortName(p.platform)}</span>`
        ).join('');
        const states = [['hit', '拍到'], ['partial', '部分拍到'], ['near', '經過附近，未涵蓋'], ['unpublished', '計畫未公布']]
            .map(([s, t]) => `<span class="item"><span class="mk sar ${s}"></span>${t}</span>`).join('');
        const rule = state.aoi ? '覆蓋框選範圍 50% 以上算拍到' : '覆蓋台灣 10% 以上算拍到';
        document.getElementById('legend').innerHTML =
            `<div class="row">每格依序：${plats}<span>（方形雷達、圓形光學）</span></div>` +
            `<div class="row">${states}</div><div class="row">${rule}，沒有標記表示無過境。</div>`;
    }

    function markerTitle(p, entry) {
        const lines = [`${p.platform} ${SENSOR_TEXT[p.sensor]}：${STATUS_TEXT[entry.status]}`];
        (entry.acquisitions || []).forEach(a => {
            let line = `${hhmm(a.start_time)} ${DIRECTION_TEXT[a.pass_direction] || ''}`;
            if (a.coverage > 0) line += `，覆蓋 ${pct(a.coverage)}，${counties(a.counties)}`;
            lines.push(line);
        });
        return lines.join('\n');
    }

    function renderCalendar() {
        const grid = document.getElementById('calendar');
        const { dates, platforms, calendar } = state.cal;
        const lead = (weekdayOf(dates[0]) + 6) % 7;                  // 週一為第一欄
        let html = '<div class="cell pad"></div>'.repeat(lead);

        dates.forEach((d, i) => {
            const [, m, day] = d.split('-').map(Number);
            const label = (i === 0 || day === 1) ? `${m}/${day}` : day;
            const marks = platforms.map(p => {
                const entry = calendar[d][p.platform];
                return `<span class="mk ${sensorClass(p.sensor)} ${entry.status}" data-platform="${p.platform}"
                              title="${markerTitle(p, entry)}"></span>`;
            }).join('');
            html += `<div class="cell${i === 0 ? ' today' : ''}${d === state.selectedDate ? ' selected' : ''}"
                          data-date="${d}" role="button" tabindex="0"
                          aria-label="${m} 月 ${day} 日（週${WEEKDAY[weekdayOf(d)]}）${i === 0 ? '，今天' : ''}"
                          ${i === 0 ? 'title="今天"' : ''}>
                        <span class="date">${label}</span><span class="marks">${marks}</span></div>`;
        });
        const tail = (7 - (lead + dates.length) % 7) % 7;
        html += '<div class="cell pad"></div>'.repeat(tail);
        grid.innerHTML = html;
    }

    function renderDetail() {
        const box = document.getElementById('day-detail');
        const d = state.selectedDate;
        if (!d) { box.innerHTML = '<p class="empty">點選日期，查看當天每顆衛星的狀態。</p>'; return; }

        const [, m, day] = d.split('-').map(Number);
        let html = `<h2>${m} 月 ${day} 日（週${WEEKDAY[weekdayOf(d)]}）</h2>`;

        const rec = state.recByDate[d];
        if (rec) {
            html += `<div class="advice"><strong>${rec.advice}</strong>
                     <span class="reason">${rec.reason}（預報信心：${rec.confidence}）</span></div>`;
        }

        html += '<ul class="sat-list">';
        state.cal.platforms.forEach(p => {
            const entry = state.cal.calendar[d][p.platform];
            html += `<li class="sat-row"><div class="head">
                        <span class="mk ${sensorClass(p.sensor)} ${entry.status}"></span>
                        <strong>${p.platform}</strong><span>${SENSOR_TEXT[p.sensor]}</span>
                        <span class="state">${STATUS_TEXT[entry.status]}</span></div>`;
            (entry.acquisitions || []).forEach(a => {
                const cloud = state.cloudById[a.id];
                const where = a.coverage > 0 ? counties(a.counties, 6) : '未涵蓋查詢範圍，點選查看條帶位置';
                html += `<button class="acq${a.id === state.selectedAcq ? ' active' : ''}"
                                 data-id="${a.id}" data-status="${entry.status}">
                            <span class="meta">
                                <span>${hhmm(a.start_time)} ${DIRECTION_TEXT[a.pass_direction] || ''}</span>
                                ${a.coverage > 0 ? `<span>覆蓋 ${pct(a.coverage)}</span>` : ''}
                                ${cloud != null ? `<span>預報雲量 ${cloud}%</span>` : ''}
                            </span>
                            <span class="where">${where}</span></button>`;
            });
            html += '</li>';
        });
        box.innerHTML = html + '</ul>';
    }

    // ---------- 互動 ----------
    function selectDate(d) {
        state.selectedDate = d;
        document.querySelectorAll('.cell.selected').forEach(c => c.classList.remove('selected'));
        document.querySelector(`.cell[data-date="${d}"]`)?.classList.add('selected');
        renderDetail();
    }

    async function showFootprint(id, status) {
        state.selectedAcq = id;
        document.querySelectorAll('.acq').forEach(b => b.classList.toggle('active', Number(b.dataset.id) === id));
        footprintLayer.clearLayers();

        let acq = footprintCache.get(id);
        if (!acq) {
            try {
                acq = await api(`/api/acquisitions/${id}`);
                footprintCache.set(id, acq);
            } catch (err) {
                showWarnings([`無法載入取像範圍：${err.message}`]);
                return;
            }
        }
        if (state.selectedAcq !== id) return;                       // 等待期間又點了別的

        const color = acq.sensor === 'SAR' ? '#e8590c' : '#1971c2';
        const layer = L.geoJSON(acq.footprint, {
            style: { color, weight: 2, fillOpacity: status === 'near' ? 0.04 : 0.12,
                     dashArray: status === 'near' ? '6 4' : null }
        }).bindTooltip(
            `<b>${acq.platform}（${SENSOR_TEXT[acq.sensor]}）</b><br>` +
            `${hhmm(acq.start_time)}–${hhmm(acq.end_time)} 台灣時間<br>${DIRECTION_TEXT[acq.pass_direction] || ''}`,
            { sticky: true, className: 'sat-tooltip' }
        ).addTo(footprintLayer);

        // S2 條帶很長，只縮放到「支援區域內的那一段」加上查詢範圍
        const fb = layer.getBounds();
        const target = L.latLngBounds(
            [Math.max(fb.getSouth(), 21), Math.max(fb.getWest(), 118)],
            [Math.min(fb.getNorth(), 27), Math.min(fb.getEast(), 123)]
        );
        const scope = state.aoi ? drawnItems.getBounds() : presetLayer.getBounds();
        if (scope.isValid()) target.extend(scope);
        map.fitBounds(target, { padding: [20, 20] });
    }

    document.getElementById('calendar').addEventListener('click', e => {
        const cell = e.target.closest('.cell:not(.pad)');
        if (!cell) return;
        selectDate(cell.dataset.date);
        // 直接點到某顆衛星的標記：同時在地圖上顯示它當天的第一趟取像
        const mk = e.target.closest('.mk');
        const entry = mk && state.cal.calendar[cell.dataset.date][mk.dataset.platform];
        if (entry?.acquisitions) showFootprint(entry.acquisitions[0].id, entry.status);
    });
    document.getElementById('calendar').addEventListener('keydown', e => {
        const cell = e.target.closest('.cell:not(.pad)');
        if (cell && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); selectDate(cell.dataset.date); }
    });
    document.getElementById('day-detail').addEventListener('click', e => {
        const btn = e.target.closest('.acq');
        if (btn) showFootprint(Number(btn.dataset.id), btn.dataset.status);
    });

    function setAoi(layer) {
        drawnItems.clearLayers();
        if (layer) drawnItems.addLayer(layer);
        state.aoi = layer ? layer.toGeoJSON().geometry : null;
        presetLayer.setStyle({ opacity: layer ? 0 : 1 });
        load();
    }
    function resetAoi() { setAoi(null); }

    map.on(L.Draw.Event.CREATED, e => setAoi(e.layer));
    map.on(L.Draw.Event.EDITED, () => setAoi(drawnItems.getLayers()[0] || null));
    map.on(L.Draw.Event.DELETED, () => { if (!drawnItems.getLayers().length) resetAoi(); });

    // ---------- 啟動 ----------
    api('/api/presets/taiwan')
        .then(p => presetLayer.addData(p.geometry))
        .catch(() => {});                                            // 外框只是輔助，失敗不影響日曆
    load();
    </script>
</body>
</html>

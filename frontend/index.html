<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>衛星觀測日曆</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <style>
        :root {
            --ink: #1d2a35;          /* 地圖墨線 */
            --ink-soft: #5d6b76;
            --paper: #f4f6f5;        /* 製圖用紙 */
            --rule: #d3dad8;
            --sea: #e6ebea;
            --sar: #5b4b8a;          /* 雷達：灰紫 */
            --sar-2: #7d6eaa;
            --msi: #0f7b6c;          /* 光學：青綠 */
            --mark: #d9a21b;         /* 測量黃：今天、選取 */
            --alert: #a63d2f;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0; display: flex; flex-wrap: wrap; color: var(--ink);
            font-family: "Noto Sans TC", system-ui, "Microsoft JhengHei", sans-serif;
            font-size: 14px; line-height: 1.5;
            font-variant-numeric: tabular-nums;
        }
        button { font: inherit; color: inherit; }
        :focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }

        /* ---------- 地圖 ---------- */
        #map { flex: 1; min-width: 300px; height: 100%; background: var(--sea); }
        .basemap { filter: grayscale(1) contrast(.88) brightness(1.06); }
        .leaflet-tooltip.strip-tip {
            font-family: inherit; font-size: 13px; color: var(--ink);
            border: 1px solid var(--ink); border-radius: 0; box-shadow: none; padding: 4px 8px;
        }
        /* 雷達條帶用斜線網紋，光學用實色：與日曆標籤同一套語言 */
        path.fp-sar { fill: url(#hatch-sar); }
        path.fp-dim { opacity: .25; }

        #resizer {
            width: 5px; flex-shrink: 0; cursor: col-resize; touch-action: none;
            background: var(--rule); transition: background .15s;
        }
        #resizer:hover, #resizer.dragging { background: var(--ink-soft); }

        /* ---------- 面板 ---------- */
        #panel {
            width: 460px; height: 100%; flex-shrink: 0; overflow-y: auto;
            background: var(--paper); padding: 20px 22px 32px;
        }
        header h1 { font-size: 19px; font-weight: 700; margin: 0; letter-spacing: .02em; }
        .scope { margin-top: 10px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
        .scope .label { color: var(--ink-soft); }
        .scope strong { font-weight: 500; }
        .actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .btn {
            border: 1px solid var(--ink); background: var(--ink); color: #fff;
            padding: 5px 12px; cursor: pointer; border-radius: 2px;
        }
        .btn.ghost { background: transparent; color: var(--ink); }
        .btn:hover { background: #2c3d4b; color: #fff; }
        .actions .note { font-size: 12px; color: var(--ink-soft); }
        .notice {
            margin-top: 12px; padding: 8px 10px; border-left: 3px solid var(--mark);
            background: #fff; font-size: 13px;
        }
        .notice .btn { margin-top: 6px; padding: 3px 10px; font-size: 13px; }
        .warning { margin-top: 12px; padding: 6px 10px; border-left: 3px solid var(--alert); color: var(--alert); font-size: 13px; background: #fff; }

        section { border-top: 1px solid var(--ink); margin-top: 20px; padding-top: 12px; }
        section > h2 {
            font-size: 13px; font-weight: 700; margin: 0 0 10px;
            display: flex; justify-content: space-between; align-items: baseline;
        }
        section > h2 small { font-weight: 400; color: var(--ink-soft); font-size: 12px; }

        /* ---------- 接下來的觀測機會 ---------- */
        .next { list-style: none; margin: 0; padding: 0; }
        .next li + li { border-top: 1px solid var(--rule); }
        .next button {
            width: 100%; background: none; border: 0; padding: 8px 0; cursor: pointer; text-align: left;
            display: grid; grid-template-columns: 74px 52px 1fr; gap: 0 12px; align-items: center;
        }
        .next button:hover .when-date { text-decoration: underline; }
        .when-date { font-size: 18px; font-weight: 700; line-height: 1.2; }
        .when-date small { display: block; font-size: 12px; font-weight: 400; color: var(--ink-soft); }
        .when-time { font-size: 16px; }
        .next .what { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .next .what .line { display: flex; gap: 8px; align-items: center; }
        .next .where { font-size: 12px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .empty { color: var(--ink-soft); font-size: 13px; margin: 0; }

        /* ---------- 衛星標籤：雷達斜線、光學實色 ---------- */
        .chip {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 24px; height: 17px; padding: 0 3px; font-size: 11px; font-weight: 700;
            line-height: 1; border: 1.5px solid var(--c); color: var(--c); background: #fff;
            letter-spacing: .02em; font-style: normal;
        }
        .chip.sar { --c: var(--sar); }
        .chip.msi { --c: var(--msi); }
        .chip.hit.msi { background: var(--msi); color: #fff; }
        .chip.hit.sar {
            color: #fff;
            background: repeating-linear-gradient(135deg, var(--sar) 0 3px, var(--sar-2) 3px 5px);
        }
        .chip.near { border-style: dashed; border-width: 1px; opacity: .55; font-weight: 500; }
        .tag { font-size: 12px; color: var(--ink-soft); }
        .tag.cloudy { color: var(--alert); }

        /* ---------- 日曆 ---------- */
        .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-soft); margin-bottom: 10px; }
        .legend span { display: inline-flex; align-items: center; gap: 5px; }
        .weekdays, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
        .weekdays { font-size: 12px; color: var(--ink-soft); padding-bottom: 4px; border-bottom: 1px solid var(--rule); }
        .weekdays span { padding-left: 4px; }
        .grid { transition: opacity .15s; }
        .grid.loading { opacity: .4; pointer-events: none; }
        .day {
            min-height: 62px; padding: 4px; cursor: pointer; background: none; border: 0;
            border-bottom: 1px solid var(--rule); border-right: 1px solid var(--rule);
            display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left;
        }
        .day:nth-child(7n) { border-right: 0; }
        .day:hover { background: #fff; }
        .day.pad { cursor: default; background: none; }
        .day .num { font-size: 12px; line-height: 1.3; padding: 0 2px; }
        .day.today .num { box-shadow: inset 0 -3px 0 var(--mark); font-weight: 700; }
        .day.selected { background: #fff; outline: 2px solid var(--ink); outline-offset: -2px; }
        .day .chips { display: flex; flex-wrap: wrap; gap: 2px; }
        .horizon { font-size: 12px; color: var(--ink-soft); margin-top: 8px; }

        /* ---------- 當日明細 ---------- */
        .advice { margin: 0 0 10px; }
        .advice strong { font-weight: 700; }
        .advice span { display: block; color: var(--ink-soft); font-size: 13px; }
        .passes { list-style: none; margin: 0; padding: 0; }
        .pass {
            width: 100%; background: none; border: 0; border-top: 1px solid var(--rule);
            padding: 8px 6px; cursor: pointer; text-align: left;
            display: grid; grid-template-columns: 34px 48px 1fr; gap: 0 10px; align-items: start;
        }
        .pass:hover, .pass.hl { background: #fff; }
        .pass .t { font-size: 15px; }
        .pass .d { display: flex; flex-direction: column; font-size: 13px; }
        .pass .d .sub { color: var(--ink-soft); font-size: 12px; }
        .quiet { margin-top: 10px; font-size: 12px; color: var(--ink-soft); }

        @media (max-width: 768px) {
            #map { height: 45%; flex-basis: 100%; }
            #resizer { display: none; }
            #panel { width: 100%; height: 55%; border-top: 1px solid var(--ink); }
        }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
    </style>
</head>
<body>
    <!-- 雷達條帶的斜線網紋，地圖上的 path 以 CSS fill: url(#hatch-sar) 引用 -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <pattern id="hatch-sar" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
                <rect width="7" height="7" fill="#5b4b8a" fill-opacity=".08"/>
                <line x1="0" y1="0" x2="0" y2="7" stroke="#5b4b8a" stroke-width="2.2" stroke-opacity=".55"/>
            </pattern>
        </defs>
    </svg>

    <div id="map"></div>
    <div id="resizer" title="拖曳調整面板寬度"></div>
    <div id="panel">
        <header>
            <h1>衛星觀測日曆</h1>
            <div class="scope" id="scope"></div>
            <div class="actions">
                <button class="btn" id="draw-rect">框選範圍</button>
                <button class="btn ghost" id="reset-aoi" hidden>改回台灣</button>
                <span class="note">也可用地圖左側工具畫多邊形</span>
            </div>
            <div id="wake" class="notice" hidden role="status"></div>
            <div id="warnings"></div>
        </header>

        <section>
            <h2>接下來的觀測機會 <small id="next-note"></small></h2>
            <ul class="next" id="next"></ul>
        </section>

        <section>
            <h2>未來 14 天 <small>點日期看當天所有過境</small></h2>
            <div class="legend">
                <span><i class="chip sar hit">1C</i>雷達拍到</span>
                <span><i class="chip msi hit">2B</i>光學拍到</span>
                <span><i class="chip msi">2B</i>部分拍到</span>
                <span><i class="chip msi near">2B</i>經過附近</span>
            </div>
            <div class="weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
            <div class="grid" id="calendar"></div>
            <p class="horizon" id="horizon"></p>
        </section>

        <section id="detail-section">
            <h2 id="detail-title">當天過境</h2>
            <div id="detail"><p class="empty">點選日期，地圖會畫出當天所有過境條帶。</p></div>
        </section>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script>
    const API_BASE = location.hostname === "localhost"
        ? "http://localhost:8000"
        : "https://sat-planner.onrender.com";
    const DAYS = 14;
    const NEXT_COUNT = 5;
    const CLOUDY = 30;                     // 與後端 CLEAR_SKY 一致

    const STATUS_TEXT = { hit: "拍到", partial: "部分拍到", near: "經過附近", none: "無過境", unpublished: "計畫未公布" };
    const DIR = { ascending: "升軌", descending: "降軌" };
    const SENSOR = { SAR: "雷達", MSI: "光學" };
    const WD = ["日", "一", "二", "三", "四", "五", "六"];

    const state = {
        aoi: null, cal: null, recByDate: {}, cloudById: {},
        selectedDate: null, highlight: null,
    };
    const footprintCache = new Map();

    // ---------- 地圖 ----------
    const map = L.map('map', { zoomControl: true }).setView([23.7, 120.9], 7);

    // 底圖：國土測繪中心「臺灣通用電子地圖」，以 CSS 轉灰階讓條帶成為主角；載入失敗改用 OSM
    const ATTR_NLSC = '底圖：<a href="https://maps.nlsc.gov.tw/">國土測繪中心</a>';
    const ATTR_REST = '天氣：Open-Meteo｜行政區界：內政部國土測繪中心';
    let basemap = L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}', {
        maxZoom: 18, className: 'basemap', attribution: `${ATTR_NLSC}｜${ATTR_REST}`
    }).addTo(map);
    let tileErrors = 0, tileLoaded = false;
    basemap.on('tileload', () => { tileLoaded = true; });
    basemap.on('tileerror', () => {
        if (tileLoaded || ++tileErrors < 6) return;
        map.removeLayer(basemap);
        basemap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            className: 'basemap', attribution: `&copy; OpenStreetMap contributors｜${ATTR_REST}`
        }).addTo(map).bringToBack();
    });

    const drawnItems = new L.FeatureGroup().addTo(map);
    const drawControl = new L.Control.Draw({
        draw: {
            polyline: false, circle: false, marker: false, circlemarker: false,
            polygon: { shapeOptions: { color: '#1d2a35', weight: 2, fillOpacity: .05 } },
            rectangle: { shapeOptions: { color: '#1d2a35', weight: 2, fillOpacity: .05 } },
        },
        edit: { featureGroup: drawnItems, remove: true }
    });
    map.addControl(drawControl);
    const presetLayer = L.geoJSON(null, {
        style: { color: '#1d2a35', weight: 1, dashArray: '3 3', fill: false }, interactive: false
    }).addTo(map);
    const stripLayer = L.featureGroup().addTo(map);
    const stripById = new Map();

    // ---------- 面板寬度拖曳 ----------
    (() => {
        const rz = document.getElementById('resizer'), panel = document.getElementById('panel');
        let raf = null;
        rz.addEventListener('pointerdown', e => { rz.setPointerCapture(e.pointerId); rz.classList.add('dragging'); document.body.style.userSelect = 'none'; });
        rz.addEventListener('pointermove', e => {
            if (!rz.hasPointerCapture(e.pointerId)) return;
            panel.style.width = `${Math.min(Math.max(window.innerWidth - e.clientX, 360), window.innerWidth * .6)}px`;
            if (!raf) raf = requestAnimationFrame(() => { map.invalidateSize(); raf = null; });
        });
        const stop = e => {
            if (!rz.hasPointerCapture(e.pointerId)) return;
            rz.releasePointerCapture(e.pointerId); rz.classList.remove('dragging');
            document.body.style.userSelect = ''; map.invalidateSize();
        };
        rz.addEventListener('pointerup', stop); rz.addEventListener('pointercancel', stop);
        window.addEventListener('resize', () => map.invalidateSize());
    })();

    // ---------- 工具 ----------
    async function api(path, body) {
        let res;
        try {
            res = await fetch(`${API_BASE}${path}`, body === undefined ? {} :
                { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        } catch {
            throw Object.assign(new Error('無法連線到伺服器'), { status: 0 });
        }
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
            const msg = typeof data.detail === 'string' ? data.detail : `伺服器回應 ${res.status}`;
            throw Object.assign(new Error(msg), { status: res.status });
        }
        return data;
    }
    const short = p => p.replace(/^S/, '');
    const sclass = s => s === 'SAR' ? 'sar' : 'msi';
    const hhmm = iso => iso.substring(11, 16);
    const pct = c => c <= 0 ? '0%' : c < .01 ? '<1%' : `${Math.round(c * 100)}%`;
    const md = d => { const [, m, day] = d.split('-').map(Number); return `${m}/${day}`; };
    const wd = d => { const [y, m, day] = d.split('-').map(Number); return new Date(Date.UTC(y, m - 1, day)).getUTCDay(); };
    const listCounties = (l, max = 3) => !l?.length ? '' : l.length <= max ? l.join('、') : `${l.slice(0, max).join('、')} 等 ${l.length} 縣市`;
    const platformOf = name => state.cal.platforms.find(p => p.platform === name);
    const isHit = a => a.coverage > 0 && a.coverage >= state.cal.aoi.hit_threshold;
    const chip = (p, cls) => `<i class="chip ${sclass(p.sensor)} ${cls}">${short(p.platform)}</i>`;

    function warn(list) {
        document.getElementById('warnings').innerHTML = list.map(w => `<div class="warning">${w}</div>`).join('');
    }

    // 把日曆資料攤平成取像清單，方便摘要與明細使用
    function passesOf(date) {
        const out = [];
        for (const p of state.cal.platforms) {
            for (const a of state.cal.calendar[date][p.platform].acquisitions || []) out.push({ ...a, p, date });
        }
        return out.sort((x, y) => x.start_time.localeCompare(y.start_time));
    }

    // ---------- 冷啟動提示 ----------
    // Render 免費方案閒置後會休眠，第一次請求要等幾十秒；超過 3 秒還沒回應就說明原因
    const wake = document.getElementById('wake');
    let wakeTimer = null;
    function startWaitNotice() {
        clearTimeout(wakeTimer);
        wakeTimer = setTimeout(() => {
            wake.innerHTML = '伺服器正在喚醒中。這個作品部署在免費方案，閒置一段時間後會休眠，第一次載入約需 30–60 秒，請稍候。';
            wake.hidden = false;
        }, 3000);
    }
    function stopWaitNotice() { clearTimeout(wakeTimer); wake.hidden = true; }
    function showRetry(message) {
        clearTimeout(wakeTimer);
        wake.innerHTML = `${message}。伺服器可能還在啟動，可以稍等一下再試。<br><button class="btn" id="retry">重新載入</button>`;
        wake.hidden = false;
        document.getElementById('retry').addEventListener('click', load);
    }

    // ---------- 載入 ----------
    async function load() {
        const grid = document.getElementById('calendar');
        grid.classList.add('loading');
        warn([]);
        clearStrips();
        startWaitNotice();

        const calReq = api('/api/calendar', state.aoi ? { geometry: state.aoi, days: DAYS } : { days: DAYS });
        const oppReq = state.aoi ? api('/api/opportunities', { geometry: state.aoi, days: DAYS }) : null;
        try {
            state.cal = await calReq;
        } catch (err) {
            oppReq?.catch(() => {});
            state.cal = null; state.selectedDate = null;
            grid.classList.remove('loading');
            ['calendar', 'next', 'detail', 'horizon', 'next-note'].forEach(id => document.getElementById(id).innerHTML = '');
            renderScope();
            if (err.status === 0 || err.status >= 500) {
                showRetry(err.message);       // 連線或伺服器問題：給重試按鈕
            } else {
                stopWaitNotice();
                warn([`無法載入：${err.message}`]);   // 輸入問題（例如範圍超出）：照實顯示
            }
            return;
        }

        state.recByDate = {}; state.cloudById = {};
        const warnings = [];
        if (oppReq) {
            try {
                const opp = await oppReq;
                opp.recommendations.forEach(r => state.recByDate[r.date] = r);
                opp.acquisitions.forEach(a => { if (a.cloud != null) state.cloudById[a.id] = a.cloud; });
                warnings.push(...opp.warnings);
            } catch (err) { warnings.push(`無法取得觀測建議：${err.message}`); }
        }
        stopWaitNotice();
        warn(warnings);
        grid.classList.remove('loading');
        if (!state.cal.dates.includes(state.selectedDate)) state.selectedDate = null;
        renderScope(); renderNext(); renderCalendar(); renderDetail();
        if (state.selectedDate) drawDay(state.selectedDate);
        else if (state.aoi) map.fitBounds(drawnItems.getBounds(), { padding: [40, 40], maxZoom: 10 });
    }

    // ---------- 繪製：面板 ----------
    function renderScope() {
        const km2 = state.cal?.aoi?.km2;
        document.getElementById('scope').innerHTML = state.aoi
            ? `<span class="label">查詢範圍</span><strong>自訂範圍${km2 != null ? `，${km2.toLocaleString()} km²` : ''}</strong>`
            : `<span class="label">查詢範圍</span><strong>台灣本島與近岸離島</strong>`;
        document.getElementById('reset-aoi').hidden = !state.aoi;
    }

    function renderNext() {
        const list = state.cal.dates.flatMap(passesOf).filter(a => a.coverage > 0).slice(0, NEXT_COUNT);
        document.getElementById('next-note').textContent =
            state.aoi ? '覆蓋框選範圍一半以上算拍到' : '覆蓋台灣 10% 以上算拍到';
        const ul = document.getElementById('next');
        if (!list.length) {
            ul.innerHTML = `<li><p class="empty">未來 ${DAYS} 天依已公布的計畫，沒有衛星拍到這個範圍。部分衛星的計畫還沒公布，可以過幾天再看。</p></li>`;
            return;
        }
        ul.innerHTML = list.map(a => {
            const cloud = state.cloudById[a.id];
            const tags = [
                isHit(a) ? '' : `<span class="tag">部分，覆蓋 ${pct(a.coverage)}</span>`,
                cloud != null ? `<span class="tag${cloud > CLOUDY ? ' cloudy' : ''}">雲量 ${cloud}%</span>` : '',
            ].join('');
            return `<li><button data-date="${a.date}" data-id="${a.id}">
                <span class="when-date">${md(a.date)}<small>週${WD[wd(a.date)]}</small></span>
                <span class="when-time">${hhmm(a.start_time)}</span>
                <span class="what">
                    <span class="line">${chip(a.p, isHit(a) ? 'hit' : '')}<span>${SENSOR[a.p.sensor]}・${DIR[a.pass_direction] || ''}</span>${tags}</span>
                    <span class="where">${listCounties(a.counties, 4)}</span>
                </span></button></li>`;
        }).join('');
    }

    function renderCalendar() {
        const { dates, platforms, calendar } = state.cal;
        const lead = (wd(dates[0]) + 6) % 7;
        let html = '<div class="day pad"></div>'.repeat(lead);

        dates.forEach((d, i) => {
            const chips = passesOf(d)
                .reduce((acc, a) => acc.some(x => x.p.platform === a.p.platform) ? acc : [...acc, a], [])
                .map(a => {
                    const st = calendar[d][a.p.platform].status;
                    return chip(a.p, st === 'hit' ? 'hit' : st === 'near' ? 'near' : '');
                }).join('');
            const label = (i === 0 || d.endsWith('-01')) ? md(d) : Number(d.slice(8));
            const cls = ['day', i === 0 && 'today', d === state.selectedDate && 'selected']
                .filter(Boolean).join(' ');
            html += `<button class="${cls}" data-date="${d}" aria-label="${md(d)} 週${WD[wd(d)]}${i === 0 ? '，今天' : ''}">
                        <span class="num">${label}</span><span class="chips">${chips}</span></button>`;
        });
        html += '<div class="day pad"></div>'.repeat((7 - (lead + dates.length) % 7) % 7);
        document.getElementById('calendar').innerHTML = html;

        document.getElementById('horizon').textContent = '計畫已公布至：' +
            platforms.map(p => `${short(p.platform)} ${md(p.published_until)}`).join('、') +
            '。超過這個日期的過境還不會出現在日曆上。';
    }

    function renderDetail() {
        const box = document.getElementById('detail'), title = document.getElementById('detail-title');
        const d = state.selectedDate;
        if (!d) {
            title.textContent = '當天過境';
            box.innerHTML = '<p class="empty">點選日期，地圖會畫出當天所有過境條帶。</p>';
            return;
        }
        title.innerHTML = `${md(d)} 週${WD[wd(d)]}的過境`;
        let html = '';
        const rec = state.recByDate[d];
        if (rec) html += `<p class="advice"><strong>${rec.advice}</strong><span>${rec.reason}，預報信心${rec.confidence}</span></p>`;

        const passes = passesOf(d);
        if (passes.length) {
            html += '<ul class="passes">' + passes.map(a => {
                const st = state.cal.calendar[d][a.p.platform].status;
                const cloud = state.cloudById[a.id];
                const sub = a.coverage > 0
                    ? `覆蓋 ${pct(a.coverage)}${cloud != null ? `，雲量 ${cloud}%` : ''}　${listCounties(a.counties, 5)}`
                    : '沒有涵蓋查詢範圍';
                return `<li><button class="pass" data-id="${a.id}">
                    ${chip(a.p, st === 'hit' ? 'hit' : st === 'near' ? 'near' : '')}
                    <span class="t">${hhmm(a.start_time)}</span>
                    <span class="d"><span>${a.p.platform} ${SENSOR[a.p.sensor]}・${DIR[a.pass_direction] || ''}，${STATUS_TEXT[st]}</span>
                    <span class="sub">${sub}</span></span></button></li>`;
            }).join('') + '</ul>';
        } else {
            html += '<p class="empty">這天沒有衛星經過查詢範圍附近。</p>';
        }
        const quiet = state.cal.platforms.filter(p => !(state.cal.calendar[d][p.platform].acquisitions));
        const none = quiet.filter(p => state.cal.calendar[d][p.platform].status === 'none').map(p => p.platform);
        const unpub = quiet.filter(p => state.cal.calendar[d][p.platform].status === 'unpublished').map(p => p.platform);
        if (none.length || unpub.length) {
            html += `<p class="quiet">${none.length ? `無過境：${none.join('、')}。` : ''}${unpub.length ? `計畫未公布：${unpub.join('、')}。` : ''}</p>`;
        }
        box.innerHTML = html;
    }

    // ---------- 繪製：地圖 ----------
    function clearStrips() { stripLayer.clearLayers(); stripById.clear(); state.highlight = null; }

    async function fetchFootprint(id) {
        if (!footprintCache.has(id)) footprintCache.set(id, api(`/api/acquisitions/${id}`));
        return footprintCache.get(id);
    }

    async function drawDay(d) {
        clearStrips();
        const passes = passesOf(d);
        let acqs;
        try {
            acqs = await Promise.all(passes.map(a => fetchFootprint(a.id)));
        } catch (err) { warn([`無法載入條帶範圍：${err.message}`]); return; }
        if (state.selectedDate !== d) return;              // 載入期間又換了日期

        passes.forEach((a, i) => {
            const acq = acqs[i], near = a.coverage <= 0;
            const color = acq.sensor === 'SAR' ? '#5b4b8a' : '#0f7b6c';
            const layer = L.geoJSON(acq.footprint, {
                style: {
                    color, weight: near ? 1.2 : 1.8, dashArray: near ? '5 4' : null,
                    fillColor: color, fillOpacity: acq.sensor === 'SAR' ? 1 : (near ? .05 : .16),
                    className: acq.sensor === 'SAR' && !near ? 'fp-sar' : '',
                }
            }).bindTooltip(
                `<b>${acq.platform} ${SENSOR[acq.sensor]}</b>　${hhmm(acq.start_time)}–${hhmm(acq.end_time)}<br>` +
                `${DIR[acq.pass_direction] || ''}，${near ? '未涵蓋查詢範圍' : `覆蓋 ${pct(a.coverage)}`}`,
                { sticky: true, className: 'strip-tip' }
            ).on('mouseover', () => setHighlight(a.id)).on('mouseout', () => setHighlight(null))
             .on('click', () => focusStrip(a.id));
            if (acq.sensor === 'SAR' && near) layer.setStyle({ fillOpacity: .03 });
            layer.addTo(stripLayer);
            stripById.set(a.id, layer);
        });
        fitToStrips([...stripById.values()]);
    }

    // 條帶常延伸到很遠，只縮放到「支援範圍內那一段」加上查詢範圍
    function fitToStrips(layers) {
        let b = state.aoi ? drawnItems.getBounds() : presetLayer.getBounds();
        for (const l of layers) {
            const f = l.getBounds();
            const clip = L.latLngBounds([Math.max(f.getSouth(), 21), Math.max(f.getWest(), 118)],
                                        [Math.min(f.getNorth(), 27), Math.min(f.getEast(), 123)]);
            b = b.isValid() ? b.extend(clip) : clip;
        }
        if (b.isValid()) map.fitBounds(b, { padding: [24, 24], maxZoom: 10 });
    }

    function setHighlight(id) {
        state.highlight = id;
        stripById.forEach((layer, key) => layer.eachLayer(p => {
            const el = p.getElement?.();
            if (el) el.classList.toggle('fp-dim', id != null && key !== id);
        }));
        document.querySelectorAll('.pass').forEach(b => b.classList.toggle('hl', Number(b.dataset.id) === id));
    }

    function focusStrip(id) {
        const layer = stripById.get(id);
        if (layer) { fitToStrips([layer]); setHighlight(id); }
    }

    // ---------- 互動 ----------
    function selectDate(d, { scroll = true } = {}) {
        state.selectedDate = d;
        document.querySelectorAll('.day.selected').forEach(c => c.classList.remove('selected'));
        document.querySelector(`.day[data-date="${d}"]`)?.classList.add('selected');
        renderDetail();
        if (scroll) document.getElementById('detail-section').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        return drawDay(d);
    }

    document.getElementById('calendar').addEventListener('click', e => {
        const day = e.target.closest('.day:not(.pad)');
        if (day) selectDate(day.dataset.date);
    });
    document.getElementById('next').addEventListener('click', async e => {
        const btn = e.target.closest('button[data-id]');
        if (!btn) return;
        await selectDate(btn.dataset.date);
        focusStrip(Number(btn.dataset.id));
    });
    const detail = document.getElementById('detail');
    detail.addEventListener('click', e => { const b = e.target.closest('.pass'); if (b) focusStrip(Number(b.dataset.id)); });
    detail.addEventListener('mouseover', e => { const b = e.target.closest('.pass'); if (b) setHighlight(Number(b.dataset.id)); });
    detail.addEventListener('mouseleave', () => setHighlight(null));

    function setAoi(layer) {
        drawnItems.clearLayers();
        if (layer) drawnItems.addLayer(layer);
        state.aoi = layer ? layer.toGeoJSON().geometry : null;
        presetLayer.setStyle({ opacity: layer ? 0 : 1 });
        load();
    }
    document.getElementById('draw-rect').addEventListener('click', () =>
        new L.Draw.Rectangle(map, drawControl.options.draw.rectangle).enable());
    document.getElementById('reset-aoi').addEventListener('click', () => setAoi(null));
    map.on(L.Draw.Event.CREATED, e => setAoi(e.layer));
    map.on(L.Draw.Event.EDITED, () => setAoi(drawnItems.getLayers()[0] || null));
    map.on(L.Draw.Event.DELETED, () => { if (!drawnItems.getLayers().length) setAoi(null); });

    // ---------- 啟動 ----------
    renderScope();
    api('/api/presets/taiwan').then(p => presetLayer.addData(p.geometry)).catch(() => {});
    load();
    </script>
</body>
</html>
